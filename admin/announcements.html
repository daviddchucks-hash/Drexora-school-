<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements — Drexora Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div id="toast-container"></div>
  <div class="spinner-overlay" id="spinner-overlay"><div class="spinner"></div></div>

  <!-- Edit Announcement Modal -->
  <div class="modal-overlay" id="edit-ann-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title"><i class="fas fa-edit"></i> Edit Announcement</span>
        <button class="modal-close" onclick="Modal.close('edit-ann-modal')"><i class="fas fa-times"></i></button>
      </div>
      <form id="edit-ann-form">
        <input type="hidden" id="edit-ann-id">
        <div class="form-group">
          <label class="form-label">Type</label>
          <div class="ann-type-select">
            <button type="button" class="ann-type-btn general active" data-type="general"><i class="fas fa-bullhorn"></i> General</button>
            <button type="button" class="ann-type-btn urgent" data-type="urgent"><i class="fas fa-exclamation-circle"></i> Urgent</button>
            <button type="button" class="ann-type-btn info" data-type="info"><i class="fas fa-info-circle"></i> Info</button>
            <button type="button" class="ann-type-btn event" data-type="event"><i class="fas fa-calendar-alt"></i> Event</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Title</label>
          <input type="text" class="form-control" id="edit-ann-title" required>
        </div>
        <div class="form-group">
          <label class="form-label">Message</label>
          <textarea class="form-control" id="edit-ann-message" rows="5" required></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="Modal.close('edit-ann-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <div class="portal-layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar admin-sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-logo">D</div>
        <div class="sidebar-brand-text">
          <div class="sidebar-brand-name">Drexora Admin</div>
          <div class="sidebar-brand-tagline">Control Panel</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Dashboard</div>
        <a class="nav-link" data-page="index.html" href="index.html"><i class="fas fa-chart-pie nav-icon"></i> Overview</a>
        <div class="nav-section-label" style="margin-top:.5rem">Management</div>
        <a class="nav-link" data-page="students.html" href="students.html"><i class="fas fa-users nav-icon"></i> Students</a>
        <a class="nav-link" data-page="results.html" href="results.html"><i class="fas fa-chart-bar nav-icon"></i> Results</a>
        <a class="nav-link active" data-page="announcements.html" href="announcements.html"><i class="fas fa-bullhorn nav-icon"></i> Announcements</a>
        <a class="nav-link" data-page="manage-admins.html" href="manage-admins.html"><i class="fas fa-user-shield nav-icon"></i> Admin Accounts</a>
        <div class="nav-section-label" style="margin-top:.5rem">Account</div>
        <a class="nav-link" data-logout href="#" style="color:#fca5a5"><i class="fas fa-sign-out-alt nav-icon"></i> Logout</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-pill">
          <div class="user-pill-avatar" id="sidebar-user-photo">A</div>
          <div class="user-pill-info">
            <div class="user-pill-name" id="sidebar-user-name">Administrator</div>
            <div class="user-pill-role" id="sidebar-user-role">Administrator</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
          <span class="topbar-title">Manage Announcements</span>
        </div>
        <div class="topbar-right">
          <button class="topbar-btn" data-theme-toggle><i class="fas fa-moon theme-icon"></i></button>
        </div>
      </header>

      <main class="page-content">
        <div class="admin-page-header">
          <h1><i class="fas fa-bullhorn" style="color:var(--gold-500)"></i> Announcements</h1>
          <p>Post and manage school announcements visible to all students.</p>
        </div>

        <div class="grid-2" style="align-items:start">
          <!-- New Announcement Form -->
          <div class="card" style="position:sticky;top:calc(var(--topbar-h) + 1rem)">
            <div class="card-header">
              <span class="card-title"><i class="fas fa-plus-circle"></i> New Announcement</span>
            </div>
            <form id="announcement-form">
              <div class="form-group">
                <label class="form-label">Announcement Type</label>
                <div class="ann-type-select">
                  <button type="button" class="ann-type-btn general active" data-type="general">
                    <i class="fas fa-bullhorn"></i> General
                  </button>
                  <button type="button" class="ann-type-btn urgent" data-type="urgent">
                    <i class="fas fa-exclamation-circle"></i> Urgent
                  </button>
                  <button type="button" class="ann-type-btn info" data-type="info">
                    <i class="fas fa-info-circle"></i> Info
                  </button>
                  <button type="button" class="ann-type-btn event" data-type="event">
                    <i class="fas fa-calendar-alt"></i> Event
                  </button>
                </div>
                <input type="hidden" id="ann-type-hidden" value="general">
              </div>
              <div class="form-group">
                <label class="form-label">Title <span style="color:var(--danger)">*</span></label>
                <input type="text" class="form-control" id="ann-title" placeholder="e.g. End of Term Examination Schedule" required>
              </div>
              <div class="form-group">
                <label class="form-label">Message <span style="color:var(--danger)">*</span></label>
                <textarea class="form-control" id="ann-message" rows="5" placeholder="Write the full announcement message here…" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-bullhorn"></i> Publish Announcement
              </button>
            </form>
          </div>

          <!-- Published Announcements -->
          <div>
            <!-- Search + Count -->
            <div class="card mb-2">
              <div class="flex-between" style="flex-wrap:wrap;gap:.75rem">
                <div class="search-bar" style="flex:1;min-width:180px">
                  <i class="fas fa-search"></i>
                  <input type="text" id="ann-search" placeholder="Search announcements…">
                </div>
                <span class="text-muted" style="font-size:.85rem;white-space:nowrap">
                  <span id="ann-count">0</span> total
                </span>
              </div>
            </div>
            <!-- List -->
            <div id="announcements-list">
              <div class="skeleton" style="height:90px;margin-bottom:1rem;border-radius:var(--radius-sm)"></div>
              <div class="skeleton" style="height:90px;margin-bottom:1rem;border-radius:var(--radius-sm)"></div>
              <div class="skeleton" style="height:90px;border-radius:var(--radius-sm)"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/admin-announcements.js"></script>
  <script>
    // Type buttons in edit modal
    document.querySelectorAll('#edit-ann-modal .ann-type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#edit-ann-modal .ann-type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  </script>
</body>
</html>
